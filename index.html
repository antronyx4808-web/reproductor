<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reproductor Premium - Playlist Masiva</title>
    <link rel="stylesheet" href="la prueba.css">
</head>
<body>

    <div class="player-container">
        <div class="screen">
            <div id="status">SISTEMA ONLINE</div>
            <div id="track-name">Cargando lista...</div>
        </div>

        <div class="controls">
            <button id="btn-prev"> Anter. </button>
            <button id="btn-play"> Play </button>
            <button id="btn-pause"> Pause </button>
            <button id="btn-stop"> Stop </button>
            <button id="btn-next"> Sigue. </button>
        </div>
    </div>

    <script src="prueba.js"></script>
</body>
</html>
