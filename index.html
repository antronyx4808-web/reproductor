<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidor de Música - Proyecto Final</title>
    <link rel="stylesheet" href="la prueba.css">
</head>
<body>

    <div id="app-wrapper">

        <div id="playlist-sidebar">
            <h3>MI PLAYLIST</h3>
            
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Buscar canción o artista...">
            </div>

            <ul id="tracks-list-ui">
                </ul>
        </div>

        <div class="player-container">
            
            <div class="lcd-display">
                <div id="lcd-title">SISTEMA ONLINE</div>
            </div>

            <div class="progress-container">
                <input type="range" id="progress-bar" value="0" min="0" max="100">
            </div>

            <div class="controls">
                <button id="btn-prev" title="Anterior">⏮</button>
                <button id="btn-play" title="Reproducir">▶</button>
                <button id="btn-pause" title="Pausar">⏸</button>
                <button id="btn-stop" title="Detener">⏹</button>
                <button id="btn-next" title="Siguiente">⏭</button>
            </div>

        </div>

        <div class="vinyl-wrapper">
            <img src="vinilo.png" class="vinyl" alt="Disco de Vinilo">
        </div>

    </div>

    <script src="prueba.js"></script>
</body>
</html>
